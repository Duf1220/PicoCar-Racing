# Sestaví a zkontroluje Flatpak na GitHub Actions (nepotřebujete Linux doma).
# Spouští se ručně (Actions -> Flatpak build -> Run workflow) nebo při změně
# souborů balíčku. Vyžaduje, aby v Release v1.0.0 už byl nahraný tar.gz.
name: Flatpak build
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'io.github.Duf1220.PicoCar-Racing/**'
      - '.github/workflows/flatpak.yml'

jobs:
  flatpak:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:freedesktop-26.08
      options: --privileged
    steps:
      - uses: actions/checkout@v4

      - name: Install flatpak-builder-lint
        run: |
          flatpak remote-add --if-not-exists --user flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          flatpak install -y --noninteractive --user flathub org.flatpak.Builder

      - name: Lint manifest
        run: |
          rm -rf "$HOME/lint" && mkdir -p "$HOME/lint" && cp -r io.github.Duf1220.PicoCar-Racing "$HOME/lint/"
          cd "$HOME/lint" && flatpak run --user --command=flatpak-builder-lint org.flatpak.Builder manifest io.github.Duf1220.PicoCar-Racing/io.github.Duf1220.PicoCar-Racing.yml

      - name: Build
        uses: flathub-infra/flatpak-github-actions/flatpak-builder@master
        with:
          manifest-path: io.github.Duf1220.PicoCar-Racing/io.github.Duf1220.PicoCar-Racing.yml
          bundle: PicoCarRacing.flatpak
          cache: false
          repository-name: flathub
          repository-url: https://dl.flathub.org/repo/flathub.flatpakrepo
          upload-artifact: true
          mirror-screenshots-url: https://dl.flathub.org/media/

      - name: Commit mirrored screenshots to repo
        run: |
          ostree commit --repo=repo --canonical-permissions --branch=screenshots/x86_64 flatpak_app/files/share/app-info/media

      - name: Lint repo
        run: |
          rm -rf "$HOME/lint-repo" && cp -r repo "$HOME/lint-repo"
          cd "$HOME" && flatpak run --user --command=flatpak-builder-lint org.flatpak.Builder repo lint-repo
