# Sestaví a zkontroluje Flatpak na GitHub Actions stejným postupem, jaký doporučuje
# dokumentace Flathubu (org.flatpak.Builder + flatpak-builder-lint).
# Spouští se ručně (Actions -> Flatpak build -> Run workflow) nebo při změně
# souborů balíčku. Vyžaduje, aby v Release v1.0.0 byly nahrané díly archivu.
name: Flatpak build
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'io.github.Duf1220.PicoCar-Racing/**'
      - '.github/workflows/flatpak.yml'

env:
  APP_ID: io.github.Duf1220.PicoCar-Racing

jobs:
  flatpak:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:freedesktop-26.08
      options: --privileged
    steps:
      - uses: actions/checkout@v4

      - name: Install org.flatpak.Builder, runtime and SDK
        run: |
          flatpak remote-add --if-not-exists --user flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          flatpak install -y --noninteractive --user flathub org.flatpak.Builder org.freedesktop.Platform//26.08 org.freedesktop.Sdk//26.08

      - name: Prepare writable build directory
        run: |
          rm -rf "$HOME/build" && mkdir -p "$HOME/build"
          cp -r "$APP_ID" "$HOME/build/"

      - name: Lint manifest
        run: |
          cd "$HOME/build"
          flatpak run --user --command=flatpak-builder-lint org.flatpak.Builder manifest "$APP_ID/$APP_ID.yml"

      - name: Build
        run: |
          cd "$HOME/build"
          flatpak run --user org.flatpak.Builder --user --force-clean --sandbox \
            --install-deps-from=flathub --default-branch=master \
            --mirror-screenshots-url=https://dl.flathub.org/media/ --compose-url-policy=full \
            --repo=repo builddir "$APP_ID/$APP_ID.yml"
          ostree commit --repo=repo --canonical-permissions --branch=screenshots/x86_64 builddir/files/share/app-info/media
          flatpak build-bundle repo "PicoCarRacing-x86_64.flatpak" --runtime-repo=https://dl.flathub.org/repo/flathub.flatpakrepo --arch=x86_64 "$APP_ID"
          ls -la PicoCarRacing-x86_64.flatpak

      - name: Lint repo
        run: |
          cd "$HOME/build"
          flatpak run --user --command=flatpak-builder-lint org.flatpak.Builder repo repo

      - name: Upload bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: PicoCarRacing-x86_64.flatpak
          path: ~/build/PicoCarRacing-x86_64.flatpak
          if-no-files-found: ignore
