# Flatpak manifest pro PicoCar Racing (Unity 2022.3.3f1, Linux x86_64 build)
#
app-id: io.github.Duf1220.PicoCar-Racing
runtime: org.freedesktop.Platform
runtime-version: '26.08'
sdk: org.freedesktop.Sdk
command: picocar-racing
separate-locales: false

finish-args:
 GPU akcelerace (OpenGL / Vulkan)$# Unity 2022 nemá nativní Wayland backend, běží přes X11 / XWayland
 GPU akcelerace (OpenGL / Vulkan)$- --share=ipc
 GPU akcelerace (OpenGL / Vulkan)$- --socket=x11
 GPU akcelerace (OpenGL / Vulkan)$# Zvuk (Unity používá PulseAudio / PipeWire-pulse)
 GPU akcelerace (OpenGL / Vulkan)$- --socket=pulseaudio
 GPU akcelerace (OpenGL / Vulkan)$# GPU akcelerace (OpenGL / Vulkan)

 GPU akcelerace (OpenGL / Vulkan)$# Gamepady (Unity čte /dev/input přes evdev). Pokud hra ovladače nepodporuje, smažte.
 GPU akcelerace (OpenGL / Vulkan)$- --device=input
 GPU akcelerace (OpenGL / Vulkan)$# Síť: hra obsahuje Unity Analytics / IAP / Ads knihovny. Nechte VYPNUTO, pokud
 GPU akcelerace (OpenGL / Vulkan)$# hra bez sítě funguje (otestovat!). Pokud ji nutně potřebuje, odkomentujte a
 GPU akcelerace (OpenGL / Vulkan)$# v metainfo popište, k čemu se síť používá.
 GPU akcelerace (OpenGL / Vulkan)$# - --share=network

modules:
 GPU akcelerace (OpenGL / Vulkan)$- name: picocar-racing
 GPU akcelerace (OpenGL / Vulkan)$  buildsystem: simple
 GPU akcelerace (OpenGL / Vulkan)$  build-commands:
 GPU akcelerace (OpenGL / Vulkan)$    - cat PicoCarRacing-1.0.0-linux-x86_64.tar.xz.part0 PicoCarRacing-1.0.0-linux-x86_64.tar.xz.part1 PicoCarRacing-1.0.0-linux-x86_64.tar.xz.part2 PicoCarRacing-1.0.0-linux-x86_64.tar.xz.part3 | tar -xJ --strip-components=1
 GPU akcelerace (OpenGL / Vulkan)$    - mkdir -p /app/lib/picocar-racing
 GPU akcelerace (OpenGL / Vulkan)$    - cp -r "PicoCar Racing.x86_64" "PicoCar Racing_Data" UnityPlayer.so /app/lib/picocar-racing/
 GPU akcelerace (OpenGL / Vulkan)$    # tar.gz vznikl na FAT SD kartě, kde se ztratil příznak spustitelnosti
 GPU akcelerace (OpenGL / Vulkan)$    - chmod 755 "/app/lib/picocar-racing/PicoCar Racing.x86_64"
 GPU akcelerace (OpenGL / Vulkan)$    - install -Dm755 picocar-racing /app/bin/picocar-racing
 GPU akcelerace (OpenGL / Vulkan)$    - install -Dm644 io.github.Duf1220.PicoCar-Racing.desktop -t /app/share/applications
 GPU akcelerace (OpenGL / Vulkan)$    - install -Dm644 io.github.Duf1220.PicoCar-Racing.metainfo.xml -t /app/share/metainfo
 GPU akcelerace (OpenGL / Vulkan)$    - install -Dm644 io.github.Duf1220.PicoCar-Racing.png /app/share/icons/hicolor/256x256/apps/io.github.Duf1220.PicoCar-Racing.png
